server {
    server_name             first_webserv;
    listen                  8080;
    host                    localhost;
    client_max_body_size    10000000;

    root                    www;
    error_page 404          error_404.html;

    location  {
        default             index.html
        allowed_methods     GET POST
        autoindex           off
    }
}

server {
    server_name             second_webserv;
    listen                  -6786785456454645;
    host                    127.0.0.1;
    client_max_body_size    10 000 000;

    root                    www;
    error_page 404          404.html;

    location / {
        allowed_methods     GET POST DELETE
        autoindex           on
    }

    location /cgi-bin {
        cgi .py /usr/bin/python3
        allowed_methods     GET POST DELETE
    }
}
